<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logros - {{ game.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <a href="{{ url_for('index') }}" class="btn btn-sm btn-secondary mb-3">← Volver</a>
      <div class="card panel-card shadow-sm p-4">
        <h3 class="mb-3">Logros para <strong>{{ game.title }}</strong></h3>
        <form method="post" class="mb-4">
          <div class="row g-2">
            <div class="col-md-6">
              <input name="title" class="form-control" placeholder="Título del logro" required>
            </div>
            <div class="col-md-3">
              <select name="difficulty" class="form-select">
                <option value="1">Fácil</option>
                <option value="2">Moderado</option>
                <option value="3" selected>Difícil</option>
                <option value="4">Muy difícil</option>
                <option value="5">Legendario</option>
              </select>
            </div>
            <div class="col-md-3">
              <button class="btn btn-primary w-100">Añadir logro</button>
            </div>
          </div>
          <div class="mt-2">
            <textarea name="description" rows="2" class="form-control" placeholder="Descripción (opcional)"></textarea>
          </div>
        </form>

        <h5>Logros guardados</h5>
        <div class="list-group">
          {% for a in achievements %}
            <div class="list-group-item d-flex justify-content-between align-items-start">
              <div>
                <div class="fw-bold">{{ a.title }}</div>
                <div class="small text-muted">{{ a.description }}</div>
              </div>
              <div class="text-end small">
                <div>Dif: {{ a.difficulty }}</div>
              </div>
            </div>
          {% else %}
            <div class="text-muted py-3">No hay logros aún.</div>
          {% endfor %}
        </div>
      </div>
    </div>
  </body>
</html>

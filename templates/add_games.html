<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Añadir Juego</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card panel-card shadow-sm mx-auto border-0 overflow-hidden" style="max-width: 720px;">
            <div class="card-body p-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="h4 mb-1">Añadir nuevo juego</h1>
                        <p class="text-muted mb-0">Completa los datos para agregar tu próximo título.</p>
                    </div>
                    <span class="badge bg-secondary">To-Play</span>
                </div>
                <form method="POST" action="{{ url_for('add_game') }}">
                    <div class="mb-3">
                        <label>Título:</label>
                        <input type="text" name="title" id="gameTitle" class="form-control" required autocomplete="off">
                        <div class="form-text text-muted">Escribe el título y selecciona una sugerencia de Steam si está disponible.</div>
                        <input type="hidden" name="steam_app_id" id="steamAppId">
                        <input type="hidden" name="steam_name" id="steamName">
                        <div id="steamSuggestions" class="list-group mt-2"></div>
                    </div>
                    <div class="mb-3">
                        <label>Plataforma:</label>
                        <select name="platform" class="form-control" required>
                            <option value="PS3">PS3</option>
                            <option value="PS4 Pro">PS4 Pro</option>
                            <option value="PS5">PS5</option>
                            <option value="Nintendo Switch">Nintendo Switch</option>
                            <option value="PC">PC</option>
                            <option value="Móvil">Móvil</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Estado:</label>
                        <select name="status" class="form-control">
                            <option value="sin jugar">sin jugar</option>
                            <option value="Jugando">Jugando</option>
                            <option value="Completado">Completado</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Progreso (%):</label>
                        <input type="number" name="progress" class="form-control" value="0" min="0" max="100">
                    </div>
                    <div class="mb-3">
                        <label>Puntuación (1-10):</label>
                        <input type="number" name="rating" class="form-control" min="1" max="10">
                    </div>
                    <div class="mb-3">
                        <label>Notas:</label>
                        <textarea name="notes" class="form-control" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Guardar</button>
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const input = document.getElementById('gameTitle');
            const suggestionsBox = document.getElementById('steamSuggestions');
            const appIdInput = document.getElementById('steamAppId');
            const nameInput = document.getElementById('steamName');

            if (!input || !suggestionsBox) return;

            let timer;
            input.addEventListener('input', function () {
                clearTimeout(timer);
                const query = this.value.trim();
                if (query.length < 2) {
                    suggestionsBox.innerHTML = '';
                    appIdInput.value = '';
                    nameInput.value = '';
                    return;
                }

                timer = setTimeout(() => {
                    fetch(`/api/steam/suggestions?query=${encodeURIComponent(query)}`)
                        .then(response => response.json())
                        .then(items => {
                            suggestionsBox.innerHTML = '';
                            if (!items.length) {
                                suggestionsBox.innerHTML = '<div class="list-group-item text-muted">Sin resultados de Steam.</div>';
                                return;
                            }
                            items.forEach(item => {
                                const button = document.createElement('button');
                                button.type = 'button';
                                button.className = 'list-group-item list-group-item-action';
                                button.textContent = `${item.name}${item.price ? ' — ' + item.price : ''}`;
                                button.addEventListener('click', () => {
                                    input.value = item.name;
                                    appIdInput.value = item.appid;
                                    nameInput.value = item.name;
                                    suggestionsBox.innerHTML = '';
                                });
                                suggestionsBox.appendChild(button);
                            });
                        });
                }, 250);
            });
        });
    </script>
</body>
</html>
